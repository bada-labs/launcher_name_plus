name: launcher_name_plus
description: >-
  Localize your Flutter app's launcher name on Android and iOS from pubspec.yaml.
  A maintained, drop-in successor of launcher_name that escapes special characters.
version: 1.0.3
repository: https://github.com/bada-labs/launcher_name_plus
issue_tracker: https://github.com/bada-labs/launcher_name_plus/issues
topics:
  - launcher
  - app-name
  - localization
  - cli

environment:
  sdk: ^3.0.0

dependencies:
  yaml: ^3.1.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0

executables:
  main:
